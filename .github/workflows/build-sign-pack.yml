name: Build & Sign (pnpm, Chrome + Firefox)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'amo' || '' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Install pnpm first so setup-node can query the pnpm store for caching
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck, lint, format
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run format

      # ---------- Build Chrome ----------
      - name: Build Chrome
        run: pnpm run build:chrome

      - name: Package Chrome (.zip)
        run: |
          (cd dist/chrome && zip -r ../../artifacts/chrome/nxdomain-watcher-chrome.zip .)

      # ---------- Build Firefox ----------
      - name: Build Firefox
        run: pnpm run build:firefox

      # ---------- Sign Firefox ----------
      - name: Submit Firefox version to addons.mozilla.org
        if: startsWith(github.ref, 'refs/tags/')
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -o pipefail
          pnpm run package:source
          if ! pnpm run sign:firefox 2>&1 | tee "$RUNNER_TEMP/web-ext.log"; then
            grep -q 'Approval: timeout exceeded' "$RUNNER_TEMP/web-ext.log" || exit 1
            echo "::warning::Mozilla didn't sign it within 30 minutes, so the GitHub Release gets an unsigned xpi."
          fi

      - name: Pick the signed xpi, or an unsigned one if Mozilla hasn't signed it yet
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          signed=$(ls artifacts/firefox/*.xpi 2>/dev/null | head -n 1)
          if [ -n "$signed" ]; then
            mv "$signed" artifacts/firefox/nxdomain-watcher-firefox.xpi
          else
            (cd dist/firefox && zip -qr ../../artifacts/firefox/nxdomain-watcher-firefox.unsigned.xpi .)
          fi

      # ---------- Upload CI artifacts (ephemeral) ----------
      - name: Upload Chrome artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nxdomain-watcher-chrome-${{ github.ref_name }}-${{ github.sha }}
          path: artifacts/chrome/*.zip
          if-no-files-found: error
          retention-days: 14

      # ---------- Publish permanent assets on tag ----------
      - name: Upload to GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            artifacts/chrome/*.zip
            artifacts/firefox/*.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
