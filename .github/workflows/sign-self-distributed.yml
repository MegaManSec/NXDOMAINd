name: Sign a self-distributed Firefox xpi (one-off)

on:
  push:
    branches: [ci/sign-self-distributed]

permissions: {}

jobs:
  sign:
    runs-on: ubuntu-latest
    environment: amo
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Firefox
        env:
          BUILD: '2'
        run: |
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::build must be a number"; exit 1; }
          pnpm run build:firefox
          version="$(node -p 'require("./package.json").version').$BUILD"
          jq --arg v "$version" '.version = $v' dist/firefox/manifest.json > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" dist/firefox/manifest.json
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Sign it on addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          : "${WEB_EXT_API_KEY:?AMO_JWT_ISSUER is not set}" "${WEB_EXT_API_SECRET:?AMO_JWT_SECRET is not set}"
          pnpm run package:source
          pnpm exec web-ext sign --source-dir=dist/firefox --artifacts-dir=artifacts/firefox \
            --channel=unlisted --upload-source-code=artifacts/firefox/source.zip --approval-timeout=1800000
          mv artifacts/firefox/*.xpi "artifacts/firefox/nxdomain-watcher-firefox-$VERSION.xpi"

      - name: Attest the xpi
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/firefox/nxdomain-watcher-firefox-${{ env.VERSION }}.xpi

      - name: Upload the xpi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nxdomain-watcher-firefox-${{ env.VERSION }}
          path: artifacts/firefox/nxdomain-watcher-firefox-${{ env.VERSION }}.xpi
          if-no-files-found: error
